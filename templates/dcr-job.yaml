apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-headless" (include "dcr.name" .) | trunc 63 | trimSuffix "-" }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
{{ include "hooks.ressources" . | indent 4 }}
spec:
  clusterIP: None
  # Providers with a trusted hosts policy reverse-resolve the IP of the job
  # pod, which sends its request before being ready
  publishNotReadyAddresses: true
  selector:
    job-name: {{ include "dcr.name" . }}
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dcr.name" . }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
{{ include "hooks.ressources" . | indent 4 }}
data:
  register.sh: |
{{ .Files.Get "scripts/register.sh" | indent 4 }}
  wait.sh: |
{{ .Files.Get "scripts/wait.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dcr.name" . }}
  labels:
    {{- toYaml (merge (deepCopy .Values.commonLabels) (dict "app" "dcr")) | nindent 4 }}
  annotations:
{{ include "hooks.job" . | indent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.ttlSeconds }}
  template:
    {{- with .Values.commonLabels }}
    metadata:
      labels:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
      {{- with .Values.waitForProvider.discoveryUrl }}
      initContainers:
        - name: wait-oidc-provider
          image: {{ include "image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/bin/sh", "/mnt/dcr/wait.sh"]
          env:
            - name: OIDC_DISCOVERY_URL
              value: {{ . | quote }}
            - name: WAIT_TTL_SECONDS
              value: {{ $.Values.waitForProvider.ttlSeconds | int | quote }}
            - name: CURL_OPTION
              value: {{ ternary "-sk" "-s" $.Values.tls.insecure | quote }}
          volumeMounts:
            - name: dcr-volume
              mountPath: /mnt/dcr
              {{- if and (not $.Values.tls.insecure) (ne $.Values.tls.certificate "") }}
            - name: ca-volume
              mountPath: /usr/local/share/ca-certificates/ca.crt
              subPath: ca.crt
              {{- end }}
      {{- end }}
      containers:
        - name: register
          image: {{ include "image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/mnt/dcr/register.sh"]
          env:
            - name: SECRET_NAME
              value: {{ .Values.secret | default .Release.Name | trunc 63 | trimSuffix "-" | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: DCR_REGISTRATION_URL
              value: {{ .Values.registrationUrl | quote }}
            - name: REQUEST
              value: {{ .Values.request | toJson | quote }}
            - name: SECRET_KEYS
              value: {{ merge .Values.mapping.keyMapping (ternary .Values.mapping.defaultKeys dict .Values.mapping.useDefault) | toJson | quote }}
            - name: CURL_OPTION
              value: {{ ternary "-sk" "-s" .Values.tls.insecure | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DNS_WAIT_TTL_SECONDS
              value: {{ .Values.waitForDns.ttlSeconds | int | quote }}
            {{- if (ne .Values.tls.certificate "") }}
            - name: TLS_CERTIFICATE
              value: {{ .Values.tls.certificate | quote }}
            {{- end }}
            {{- if ne (.Values.registrationToken.secretName | default "") "" }}
            - name: REGISTRATION_TOKEN_FILE
              value: /mnt/registration-token/token
            {{- end }}
          volumeMounts:
            - name: dcr-volume
              mountPath: /mnt/dcr
              {{- if and (not .Values.tls.insecure) (ne .Values.tls.certificate "") }}
            - name: ca-volume
              mountPath: /usr/local/share/ca-certificates/ca.crt
              subPath: ca.crt
              {{- end }}
              {{- if ne (.Values.registrationToken.secretName | default "") "" }}
            - name: registration-token
              mountPath: /mnt/registration-token
              readOnly: true
              {{- end }}
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
      serviceAccountName: {{ include "service_account.name" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      volumes:
        - name: dcr-volume
          configMap:
            defaultMode: 493
            name: {{ include "dcr.name" . }}
        {{- if and (not .Values.tls.insecure) (ne .Values.tls.certificate "") }}
        - name: ca-volume
          secret:
            secretName: {{ .Values.tls.certificate }}
        {{- end }}
        {{- if ne (.Values.registrationToken.secretName | default "") "" }}
        - name: registration-token
          secret:
            secretName: {{ .Values.registrationToken.secretName }}
            items:
              - key: {{ .Values.registrationToken.secretKey | default "token" }}
                path: token
        {{- end }}
      restartPolicy: Never
