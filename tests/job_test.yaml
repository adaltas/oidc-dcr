suite: Job configuration
templates:
  - dcr-job.yaml
set:
  registration_url: "http://example.com"
  request:
    redirect_uris:
      - "http://example.com/oauth2/callback"
tests:
  - it: "should retry the job once by default"
    asserts:
      - documentIndex: 2
        equal:
          path: spec.backoffLimit
          value: 1

  - it: "should set the number of retries of the job"
    set:
      backoff_limit: 6
    asserts:
      - documentIndex: 2
        equal:
          path: spec.backoffLimit
          value: 6

  - it: "should fail schema validation when backoff_limit is negative"
    set:
      backoff_limit: -1
    asserts:
      - failedTemplate: {}
