suite: Job configuration
templates:
  - dcr-job.yaml
set:
  registrationUrl: "http://example.com"
  request:
    redirect_uris:
      - "http://example.com/oauth2/callback"
tests:
  - it: "should retry the job once by default"
    asserts:
      - documentIndex: 2
        equal:
          path: spec.backoffLimit
          value: 1

  - it: "should set the number of retries of the job"
    set:
      backoffLimit: 6
    asserts:
      - documentIndex: 2
        equal:
          path: spec.backoffLimit
          value: 6

  - it: "should fail schema validation when backoffLimit is negative"
    set:
      backoffLimit: -1
    asserts:
      - failedTemplate: {}

  - it: "should call the registrationUrl"
    asserts:
      - documentIndex: 2
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DCR_REGISTRATION_URL
            value: "http://example.com"

  - it: "should delete the job as soon as it finishes by default"
    asserts:
      - documentIndex: 2
        equal:
          path: spec.ttlSecondsAfterFinished
          value: 0

  - it: "should keep the job ttlSeconds after it finishes"
    set:
      ttlSeconds: 300
    asserts:
      - documentIndex: 2
        equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
